<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>苏天翼 · 个人主页</title>
<style>
    :root {
        --blue: #4a90e2;
        --light-blue: #8fb8e0;
        --ink: #1f2328;
        --muted: #5b6672;
        --line: #e6ebf1;
        --bg: #fbfcfd;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    html { height: 100%; }

    body {
        min-height: 100%;
        background: var(--bg);
        color: var(--ink);
        font-family: "PingFang SC", "Microsoft YaHei", "Hiragino Sans GB",
                     "Source Han Sans SC", "Noto Sans CJK SC", sans-serif;
        -webkit-font-smoothing: antialiased;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 60px 40px;
    }

    .card {
        width: 100%;
        max-width: 1180px;
        display: grid;
        grid-template-columns: 1fr 1fr;
        align-items: center;
        gap: 60px;
    }

    /* ---------- 左侧文字 ---------- */
    .intro { padding-right: 20px; }

    .greeting {
        font-size: 20px;
        font-weight: 400;
        color: var(--blue);
        letter-spacing: 2px;
        margin-bottom: 10px;
    }

    .name {
        font-size: 68px;
        font-weight: 700;
        color: var(--ink);
        letter-spacing: 4px;
        line-height: 1.15;
        margin-bottom: 12px;
    }

    .role {
        font-size: 36px;      /* 比名字小两号 */
        font-weight: 500;
        color: var(--light-blue);
        letter-spacing: 2px;
        margin-bottom: 28px;
    }

    .divider {
        width: 56px;
        height: 3px;
        background: var(--blue);
        border-radius: 2px;
        margin-bottom: 28px;
    }

    .bio {
        font-size: 17px;
        line-height: 2.1;
        color: var(--muted);
        max-width: 520px;
    }

    .bio strong { color: var(--ink); font-weight: 600; }

    .tags {
        margin-top: 30px;
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
    }

    .tag {
        font-size: 14px;
        color: var(--blue);
        background: rgba(74, 144, 226, 0.08);
        border: 1px solid rgba(74, 144, 226, 0.25);
        border-radius: 999px;
        padding: 6px 16px;
    }

    /* ---------- 右侧头像 ---------- */
    .portrait {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 18px;
    }

    .avatar-wrap {
        position: relative;
        width: 372px;
        height: 372px;
        padding: 10px;
        border-radius: 50%;
        background: #fff;
        box-shadow: 0 18px 44px rgba(74, 144, 226, 0.14),
                    0 0 0 1px rgba(74, 144, 226, 0.10);
    }

    /* 外圈装饰环 */
    .avatar-wrap::after {
        content: "";
        position: absolute;
        inset: -16px;
        border-radius: 50%;
        border: 1px solid rgba(74, 144, 226, 0.22);
        pointer-events: none;
    }

    .avatar {
        width: 100%;
        height: 100%;
        border-radius: 50%;
        border: 2px dashed #c9d7e6;
        background: #f2f6fa;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        overflow: hidden;
        transition: box-shadow .25s, transform .25s, border-color .25s;
    }

    .avatar:hover {
        border-color: var(--blue);
        box-shadow: 0 10px 34px rgba(74, 144, 226, 0.22);
        transform: translateY(-2px);
    }

    .avatar img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        object-position: center 22%;   /* 证件照向上取景，让面部居中 */
        display: none;
        border-radius: 50%;
    }

    .avatar.has-img { border-style: solid; border-color: transparent; }
    .avatar.has-img img { display: block; }
    .avatar.has-img .placeholder { display: none; }

    .placeholder {
        text-align: center;
        color: #92a4b8;
        user-select: none;
        padding: 0 40px;
    }

    .placeholder .icon {
        font-size: 40px;
        line-height: 1;
        margin-bottom: 14px;
        color: var(--light-blue);
    }

    .placeholder .t1 { font-size: 16px; margin-bottom: 6px; color: #6b7c8f; }
    .placeholder .t2 { font-size: 13px; color: #a3b1c0; }

    .hint {
        font-size: 13px;
        color: #9aa8b6;
        letter-spacing: .5px;
    }

    .email {
        margin-top: -6px;
        font-size: 16px;
        letter-spacing: .8px;
        display: flex;
        align-items: center;
        gap: 8px;
    }

    .mail-icon {
        font-size: 15px;
        color: var(--light-blue);
    }

    .email a {
        color: var(--blue);
        text-decoration: none;
        padding-bottom: 2px;
        border-bottom: 1px solid rgba(74, 144, 226, 0.28);
        transition: color .2s, border-color .2s;
    }

    .email a:hover {
        color: #2f74c4;
        border-bottom-color: #2f74c4;
    }

    .actions { display: flex; gap: 12px; }

    .btn {
        font: inherit;
        font-size: 13px;
        color: var(--blue);
        background: #fff;
        border: 1px solid rgba(74, 144, 226, 0.35);
        border-radius: 999px;
        padding: 7px 18px;
        cursor: pointer;
        transition: background .2s, color .2s;
    }

    .btn:hover { background: var(--blue); color: #fff; }

    input[type="file"] { display: none; }

    @media (max-width: 900px) {
        .card { grid-template-columns: 1fr; gap: 40px; }
        .name { font-size: 48px; }
        .role { font-size: 28px; }
        .avatar-wrap { width: 260px; height: 260px; }
    }
</style>
</head>

<main class="card">

            个人爱好喜欢看<strong>科幻类</strong>、<strong>历史类</strong>文学作品，喜好烘焙，
            喜爱素描、速写、水彩，也喜欢打羽毛球。
        </p>
        <div class="tags">
            <span class="tag">C 语言</span>
            <span class="tag">Python</span>
            <span class="tag">Java</span>
            <span class="tag">科幻 · 历史</span>
            <span class="tag">烘焙</span>
            <span class="tag">素描 · 速写 · 水彩</span>
            <span class="tag">羽毛球</span>

            <a href="mailto:stysr200754@qq.com">stysr200754@qq.com</a>
        </p>

        <div class="actions">
            <button class="btn" id="pickBtn" type="button">更换图片</button>
            <button class="btn" id="clearBtn" type="button">恢复默认照片</button>
        </div>
        <input type="file" id="fileInput" accept="image/*">
    </section>
</main>

<script>
    const fileInput = document.getElementById('fileInput');
    const preview   = document.getElementById('preview');
    const avatar    = document.getElementById('avatar');

    // 页面内置的默认头像（图片已直接嵌入本文件，不依赖外部图片文件）
    const DEFAULT_SRC = preview.getAttribute('src') || '';

    function showImage(src) {
        preview.src = src;
        avatar.classList.add('has-img');
    }

    fileInput.addEventListener('change', function () {
        const file = this.files && this.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = function (e) { showImage(e.target.result); };
        reader.readAsDataURL(file);
    });

    document.getElementById('pickBtn').addEventListener('click', function () {
        fileInput.click();
    });

    // 恢复为默认照片
    document.getElementById('clearBtn').addEventListener('click', function () {
        fileInput.value = '';
        showImage(DEFAULT_SRC);
    });

    // 默认图片缺失时退回占位框
    preview.addEventListener('error', function () {
        avatar.classList.remove('has-img');
    });

    // 支持直接把图片拖进圆形框
    avatar.addEventListener('dragover', function (e) {
        e.preventDefault();
        avatar.style.borderColor = '#4a90e2';
    });
    avatar.addEventListener('dragleave', function () {
        avatar.style.borderColor = '';
    });
    avatar.addEventListener('drop', function (e) {
        e.preventDefault();
        avatar.style.borderColor = '';
        const file = e.dataTransfer.files && e.dataTransfer.files[0];
        if (file && file.type.startsWith('image/')) {
            const reader = new FileReader();
            reader.onload = function (ev) { showImage(ev.target.result); };
            reader.readAsDataURL(file);
        }
    });
</script>

</body>
</html>
